<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Amount</title>
  <style>
    body{
      font-family: 'Poppins', sans-serif;
       background: linear-gradient(135deg, #6a11cb, #2575fc);
       height:100vh ;
    }
    h5{
      font-size: 40px;
      color: aliceblue;
    }
    p{
      font-size: 25px;
      color: aliceblue;
    }
  </style>
</head>
<body>
  <center><h5>Amount Sent Successfully ✅</h5></center>
  <center>
    <p id="showUser"></p>
    <p id="showAmount"></p>
  </center>

  <script>
    // URL থেকে parameters read করা
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("id");
    const userName = params.get("name");
    const amount = params.get("amount");

    document.getElementById("showUser").innerText =
      "User: " + userName + " (ID: " + userId + ")";
    document.getElementById("showAmount").innerText =
      "You sent: " + amount;
  </script>
</body>
</html>
