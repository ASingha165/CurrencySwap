<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Swap</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .swap-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      color: #fff;
    }
    h4 {
      font-size: 25px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 7px;
      outline: none;
      font-size: 14px;
    }
    button {
      width: 48%;
      padding: 10px;
      margin-top: 15px;
      border: none;
      border-radius: 7px;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      cursor: pointer;
    }
    .btns {
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="swap-box">
    <h4><u>Currency Swap</u></h4>

    <!-- From Currency -->
    <input list="currencies" id="currency" name="currency" placeholder="From">
    <datalist id="currencies">
      <option value="USD - US Dollar">
      <option value="EUR - Euro">
      <option value="GBP - British Pound">
      <option value="JPY - Japanese Yen">
      <option value="INR - Indian Rupee">
    </datalist>

    <!-- To Currency -->
    <input list="currencies" id="to" name="to" placeholder="To">

    <!-- Amount -->
    <input type="number" id="amount" name="amount" placeholder="Enter the amount" required>

    <!-- Final Converted Amount -->
    <input type="text" id="final" name="final" placeholder="Final amount" readonly>

    <div class="btns">
      <button onclick="convertCurrency()">Convert</button>
      <button onclick="sendAmount()">Send</button>
    </div>
  </div>

  <script>
    function convertCurrency() {
      let amount = document.getElementById("amount").value;
      let rate = 80; // demo conversion rate
      let finalAmount = amount * rate;

      document.getElementById("final").value = finalAmount;

      // localStorage এ save
      localStorage.setItem("convertedAmount", finalAmount);
    }

    function sendAmount() {
      // transfer.html এ redirect
      window.location.href = "transfer.html";
    }
  </script>
</body>
</html>
