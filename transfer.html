<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfers</title>
    <style>
        body{
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            height: 100vh;
        }
        .transfer-box{
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            height: 300px ;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            color: #fff;
            margin-top: 140px;
        }
        h4{
            font-size: 25px;
        }
        input{
            width: 100%;
            padding: 5px;
            border: none;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }
        button, input[type="button"]{
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <center>
        <div>
            <section id="swap">
                <div class="transfer-box">
                    <h4><u>Transfers</u></h4>
                    
                    <input type="text" id="to" name="to" placeholder="User Id">
                    <br><br>
                    
                    <input type="text" id="amount" name="amount" placeholder="User Name" required>
                    <br><br>

                    <!-- এখানে auto-fill হবে -->
                    <input type="number" id="final" name="final" placeholder="Final amount" readonly>
                    <br><br>

                    <div class="buttons">
                        <input type="button" value="Confirm" onclick="sendAmount()">
                    </div>
                </div>
            </section>
        </div>
    </center>

   <script>
      // Currency Swap থেকে LocalStorage এ রাখা ডাটা আনবো
      window.onload = function() {
          let finalAmount = localStorage.getItem("convertedAmount");
          if(finalAmount){
              document.getElementById("final").value = finalAmount;
          }
      }

      function sendAmount(){
          let userId = document.getElementById("to").value;
          let userName = document.getElementById("amount").value;
          let finalAmount = document.getElementById("final").value;

          // success page এ তিনটা value পাঠাচ্ছি
          window.location.href = 
            "send.html?id=" + encodeURIComponent(userId) +
            "&name=" + encodeURIComponent(userName) +
            "&amount=" + encodeURIComponent(finalAmount);
      }
   </script>

</body>
</html>
